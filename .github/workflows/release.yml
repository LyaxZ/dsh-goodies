name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm pack` does NOT run `prepublishOnly` (only `npm publish` does), so
      # the suites run here; they also prove the committed `lib/` matches `src/`
      # before any rebuild could mask a stale artifact.
      - name: Install test dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Verify sources and artifacts
        run: npm run verify

      - name: Pack tarball
        run: |
          ASSET=$(npm pack --silent)
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          # stable name so /releases/latest/download/dsh-goodies.tgz always works
          cp "$ASSET" dsh-goodies.tgz
          echo "STABLE=dsh-goodies.tgz" >> "$GITHUB_ENV"

      - name: Check the tag matches the package version
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME does not match package.json"; exit 1; }

      # The release body defaults to the CHINESE changelog section for this tag,
      # with the English section folded into a collapsible block.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          extract() {
            awk -v pat="## $VERSION " '
              /^## / {
                line = $0
                gsub(/[\[\]]/, "", line)
                if (index(line, pat) == 1) { found = 1; next }
                if (found) exit
              }
              found { print }
            ' "$1"
          }
          extract CHANGELOG.md > NOTES.zh.md
          if [ -f CHANGELOG.en.md ]; then extract CHANGELOG.en.md > NOTES.en.md; fi
          if [ ! -s NOTES.zh.md ]; then
            echo "CHANGELOG.md has no '## [$VERSION]' section — add it before tagging"
            exit 1
          fi
          {
            printf '**dsh-goodies %s**\n' "$VERSION"
            cat NOTES.zh.md
            if [ -s NOTES.en.md ]; then
              printf '\n<details>\n<summary>English</summary>\n\n'
              cat NOTES.en.md
              printf '\n</details>\n'
            fi
          } > NOTES.full.md

      - name: Create or update release with tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" "$STABLE" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file NOTES.full.md
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" "$STABLE" \
              --title "$GITHUB_REF_NAME" --notes-file NOTES.full.md
          fi
